<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — NOUN Exam Summary Hub</title>
<meta name="theme-color" content="#006400" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="header-mount"></div>

<main class="container">
  <div class="card auth-card">
    <h1>Create Your Account</h1>
    <p class="text-center muted" style="margin-bottom:20px;">Join NOUN Exam Summary Hub in seconds.</p>
    <div id="formAlert"></div>
    <form class="form" id="signupForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
        <small>Use at least 6 characters.</small>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Re-enter your password" />
      </div>
      <button type="submit" class="btn btn--primary btn--block" id="signupBtn">Create Account</button>
    </form>
    <p class="auth-card__foot">Already have an account? <a href="login.html" style="color:var(--green); font-weight:700;">Log in</a></p>
  </div>
</main>

<div id="footer-mount"></div>
<script type="module" src="js/main.js"></script>
<script type="module">
  import { signUp } from "./js/auth.js";
  import { toast, friendlyError, setButtonLoading } from "./js/main.js";

  const form = document.getElementById("signupForm");
  const alertBox = document.getElementById("formAlert");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;
    const btn = document.getElementById("signupBtn");

    if (password !== confirm) {
      alertBox.innerHTML = `<div class="alert alert--error">Passwords do not match.</div>`;
      return;
    }

    setButtonLoading(btn, true, "Creating account...");
    try {
      await signUp(email, password);
      toast("Account created! Welcome to NOUN Exam Summary Hub.", "success");
      window.location.href = "index.html";
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert--error">${friendlyError(err)}</div>`;
      setButtonLoading(btn, false);
    }
  });
</script>
</body>
</html>
